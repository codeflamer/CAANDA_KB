# bge-base dedup index + ms-marco rerank (pool 100) + rule-based sub-queries fused with RRF. Reuses the bge dedup collection (no re-index).
collection: ircc_full_bge-base_c180_dedup
embedding_model: BAAI/bge-base-en-v1.5
query_prefix: "Represent this sentence for searching relevant passages: "
chunking_method: section_words
chunk_size: 180
chunk_overlap: 30
add_heading_path: true
dedupe_chunks: true
top_k_retrieve: 100
reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
split_queries: true
fusion: round_robin
subquery_filter: true
