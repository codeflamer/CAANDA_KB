# Best config (ircc_full_bge-base_c180_dedup_rerank_msmarco_k100_split_rr_filter_expand_exact) + chain retrieval (chain_hops: 2): LLM reads the top 3 hop-1 passages and writes 0-2 queries for what is still missing; hop-2 lists round-robin fused after hop 1.
collection: ircc_full_bge-base_c180_dedup
embedding_model: BAAI/bge-base-en-v1.5
query_prefix: "Represent this sentence for searching relevant passages: "
chunking_method: section_words
chunk_size: 180
chunk_overlap: 30
add_heading_path: true
dedupe_chunks: true
top_k_retrieve: 100
reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
split_queries: true
fusion: round_robin
subquery_filter: true
expand_section: true
expand_max_words: 450
search: exact
chain_hops: 2
