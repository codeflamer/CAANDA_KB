# Best config (bge-base, dedup, ms-marco k100, split + round-robin + filter) + section expansion (small-to-big). Reuses the bge dedup collection (no re-index). Exact cosine search instead of Chroma HNSW (search: exact).
collection: ircc_full_bge-base_c180_dedup
embedding_model: BAAI/bge-base-en-v1.5
query_prefix: "Represent this sentence for searching relevant passages: "
chunking_method: section_words
chunk_size: 180
chunk_overlap: 30
add_heading_path: true
dedupe_chunks: true
top_k_retrieve: 100
reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
split_queries: true
fusion: round_robin
subquery_filter: true
expand_section: true
expand_max_words: 450
search: exact
